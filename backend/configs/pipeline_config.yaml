fusion:
  categories:
    both: BOTH
    unet_only: UNET_ONLY
    yolo_only: YOLO_ONLY
  centroid_dist_ratio: 0.08
  iou_threshold: 0.25
  mask_in_box_threshold: 0.2
  weights:
    unet: 0.45
    yolo: 0.55
geospatial:
  default_altitude_m: 12.0
  default_slant_range_m: 75.0
  strict_unreferenced_suppression: true
  target_crs: EPSG:4326
multiframe:
  enabled: true
  iou_weight: 0.4
  max_frame_gap: 5
  spatial_distance_threshold_px: 80.0
  trajectory_weight: 0.6
performance:
  adaptive_tiling_threshold: 1100
  async_audit_logging: true
  batch_size_unet: 16
  batch_size_yolo: 16
  enable_coarse_screening: true
  enable_fp16: true
  enable_gpu: true
  enable_onnx: true
  target_latency_seconds: 20
risk_priority:
  area_thresholds:
    medium_max_sq_m: 25.0
    small_max_sq_m: 5.0
  hazard_weights:
    default: 50
    engine_debris: 80
    fishing_net: 90
    pipeline_or_cable: 70
    plastic_debris: 60
    riprap_debris: 45
    shipwreck_fragment: 85
  priority_formula_weights:
    detection_evidence: 0.25
    hazard_risk: 0.45
    location_sensitivity: 0.15
    object_extent: 0.15
  reliability_modulation:
    good: 0.95
    moderate: 0.85
    noisy: 0.75
    optimal: 1.0
system:
  device: auto
  log_level: INFO
  project_name: Sea Sentinel Dual-Path AI Engine
  version: 2.0.0
tiling:
  enabled: true
  min_image_dim_for_tiling: 900
  nms_iou_threshold: 0.4
  overlap_ratio: 0.25
  tile_size: 640
unet:
  checkpoint_path: models/unet/attention_unet_best.pt
  confidence_threshold: 0.45
  max_component_area_ratio: 0.4
  min_component_area_px: 150
  model_type: attention_unet
  morphology:
    apply_closing: true
    apply_opening: true
    kernel_size: 3
  patch_size: 256
  stride: 192
verification:
  autoencoder_checkpoint: models/autoencoder/baseline_autoencoder.pt
  enabled: true
  min_verification_score: 0.35
  rock_cluster_eps: 70.0
  rock_cluster_min_samples: 4
  weights:
    contrast: 0.25
    model_confidence: 0.3
    morphology_compactness: 0.2
    shadow_relief: 0.25
yolo:
  conf_threshold: 0.25
  img_size: 640
  iou_threshold: 0.45
  max_detections: 50
  model_path: models/yolo/best.pt
